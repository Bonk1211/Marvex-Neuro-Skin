[project]
name = "neuroskin-api"
version = "0.1.0"
description = "Deterministic NeuroSkin simulation API"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "scikit-learn>=1.5,<2",
  "joblib>=1.4,<2",
  "pyarrow>=17,<24",
  "pandas>=2.2,<3",
  "pvlib>=0.11,<1",
  "pydantic>=2.8,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "jupyterlab>=4,<5",
  "matplotlib>=3.8,<4",
  "nbconvert>=7,<8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore::starlette.exceptions.StarletteDeprecationWarning",
  "ignore:The 'generic' unit for NumPy timedelta is deprecated:DeprecationWarning",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
